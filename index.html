:root{color-scheme:light;--navy:#19365d;--blue:#6dc6f0;--line:#d6dde6;--bg:#eef2f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1c2430;font:16px/1.4 RC,"Arial Narrow",Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 22px;font-size:20px;font-weight:500}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;padding:22px;max-width:1200px;margin:auto}
@media(max-width:820px){.app{grid-template-columns:1fr}.stage{order:-1}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;align-self:start}
h2{margin:6px 0 0;font-size:14px;font-weight:700;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#46515f}
input[type=text]{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#1c2430;background:#fff}
input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
small{color:#6a7584;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;padding:10px 16px;border-radius:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;text-align:center}
button.primary{background:var(--navy);color:#fff;font-size:18px;padding:12px 18px;width:100%}
button:hover,.btn:hover{filter:brightness(.95)}
input[type=file]{display:none}
.stage{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas{width:100%;max-width:760px;height:auto;aspect-ratio:1;border-radius:8px;box-shadow:0 6px 24px rgba(25,54,93,.18);cursor:grab;touch-action:none;background:#fff}
canvas:active{cursor:grabbing}
</style>
</head>
<body>
<header>Quote Card Maker</header>
<div class="app">
  <div class="panel">
    <h2>Photo</h2>
    <div class="row">
      <label class="btn" for="file">Choose photo…</label><input id="file" type="file" accept="image/*">
      <button id="resetPhoto" type="button">Original photo</button>
    </div>
    <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
    <small>Drag the photo on the preview to move it inside the circle.</small>

    <h2>Name</h2>
    <label>Name (shown in blue) <input id="name" type="text" maxlength="40" autocomplete="off"></label>
    <small>This is the only text you can change. The rest of the card is fixed.</small>

    <div class="row"><button id="resetText" type="button">Reset name</button></div>
    <button id="dl" class="primary" type="button">Download JPG</button>
  </div>
  <div class="stage"><canvas id="cv" width="1280" height="1280"></canvas></div>
</div>

const DEF_NAME = "Lady Gaga";
// where the photo shows (inside the ring), the clip around it, and where the first body line sits
const VB = {x0:632.4, x1:1280, y0:467, y1:1262.2}, V = {x:956.2, y:864.6};
const CLIP = {cx:1037.5, cy:864.6, rx:430, ry:422};
const ORIG = {x:562.659607, y:420.739868, s:1.495537};
const LINE1 = {x:79.04, y:774.3125, size:32, ringCx:1043.4, ringCy:864.6, ringR:488};
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const font = (w, s) => `${w} ${s}px RC, "Arial Narrow", sans-serif`;
const img = {};
let photo = null, p = {...ORIG};

const baseScale = () => Math.max((VB.x1 - VB.x0)/photo.width, (VB.y1 - VB.y0)/photo.height);
function clampPhoto() {
  const w = photo.width*p.s, h = photo.height*p.s;
  p.x = Math.min(VB.x0, Math.max(VB.x1 - w, p.x));
  p.y = Math.min(VB.y0, Math.max(VB.y1 - h, p.y));
}
function setZoom(z) {                                   // zoom around the middle of the visible circle
  const ix = (V.x - p.x)/p.s, iy = (V.y - p.y)/p.s;
  p.s = baseScale()*z; p.x = V.x - ix*p.s; p.y = V.y - iy*p.s;
}
function syncZoom() { $("zoom").value = Math.min(3, Math.max(1, p.s/baseScale())); }
function useOriginal() { photo = img.PHOTO; p = {...ORIG}; syncZoom(); }

function ringLeft(y) {                                  // keep a long name from running into the photo ring
  const dy = y - LINE1.ringCy;
  return Math.abs(dy) >= LINE1.ringR ? W : LINE1.ringCx - Math.sqrt(LINE1.ringR**2 - dy*dy);
}
function nameLine() {
  const name = $("name").value.trim();
  const segs = [["I am ", 300, INK], [name, 500, BLUE], [" and", 300, INK]];
  const width = s => segs.reduce((a, [t, w]) => (ctx.font = font(w, s), a + ctx.measureText(t).width), 0);
  const avail = ringLeft(LINE1.y - 24) - LINE1.x - 20;
  const size = Math.min(LINE1.size, LINE1.size*avail/(width(LINE1.size) || 1));
  let x = LINE1.x;
  for (const [t, w, c] of segs) { ctx.font = font(w, size); ctx.fillStyle = c; ctx.fillText(t, x, LINE1.y); x += ctx.measureText(t).width; }
}

function draw() {
  if (!img.A) return;
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.drawImage(img.A, 0, 0, W, W);                      // background
  if (photo) {
    clampPhoto();
    ctx.save(); ctx.beginPath(); ctx.ellipse(CLIP.cx, CLIP.cy, CLIP.rx, CLIP.ry, 0, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(photo, p.x, p.y, photo.width*p.s, photo.height*p.s); ctx.restore();
  }
  ctx.drawImage(img.B, 0, 0, W, W);                      // ring, header, headline, logo, hashtag, body lines 2-4
  nameLine();                                            // the only editable text
}

$("name").addEventListener("input", draw);
$("zoom").addEventListener("input", e => { if (photo) { setZoom(+e.target.value); draw(); } });
$("resetText").onclick = () => { $("name").value = DEF_NAME; draw(); };
$("resetPhoto").onclick = () => { useOriginal(); draw(); };
function openPhoto(f) {
  if (!f) return;
  load(URL.createObjectURL(f)).then(i => {
    photo = i; const s = baseScale(); p = {x:0, y:0, s}; p.x = V.x - photo.width*s*0.5; p.y = V.y - photo.height*s*0.42; syncZoom(); draw();
  }).catch(() => alert("Sorry, that file could not be opened as an image."));
}
$("file").onchange = e => { openPhoto(e.target.files[0]); e.target.value = ""; };

let drag = null;                                         // drag the photo
cv.onpointerdown = e => { drag = {x:e.clientX, y:e.clientY}; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => {
  if (!drag || !photo) return;
  const k = W/cv.getBoundingClientRect().width;
  p.x += (e.clientX - drag.x)*k; p.y += (e.clientY - drag.y)*k; drag = {x:e.clientX, y:e.clientY}; draw();
};
cv.onpointerup = cv.onpointercancel = () => { drag = null; };
cv.ondragover = e => e.preventDefault();                 // drop an image onto the preview
cv.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith("image/")) openPhoto(f); };

$("dl").onclick = () => cv.toBlob(b => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = "datathon2026-quote-card.jpg"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}, "image/jpeg", 0.95);

(async () => {
  $("name").value = DEF_NAME;
  await Promise.all([300, 400, 500, 700].map(w => document.fonts.load(`${w} 40px RC`)));
  for (const k in SRC) img[k] = await load(SRC[k]);
  useOriginal(); draw();
})();
